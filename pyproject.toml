[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytoy-llm"
version = "0.1.0"
description = "Thin, stateless LLM CLI wrapper for editor integrations (Vim/Neovim)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
  "litellm>=1.90.0",
  "pydantic>=2.5",
  "pydantic-ai>=2.15.0",
  "pydantic-ai-litellm>=0.2.3",
  "typer>=0.12",
  "orjson>=3.9",
  "GitPython",
]

[dependency-groups]

dev = [
  "pytest",
  "ruff",
  "ty",
  "mypy",
]


[project.scripts]
pytoy-llm = "pytoy_llm.cli:app"


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 128
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E731",
]


